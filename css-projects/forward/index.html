<body>

  <div class="container-form">
    <form class="form">
      <h1 class="form-title">תן לנו להוביל אותך קדימה</h1>
<p class="form-text">
  אנחנו כאן כדי לעזור לך להתקדם ולממש את המטרות שלך. אנא מלא את פרטיך וניצור איתך קשר בהקדם האפשרי כדי לספק לך את כל
  המידע שאתה צריך.
</p>

      <div class="form-control">
        <label for="name">שם מלא</label>
        <input id="name" type="name" required />
      </div>

      <div class="form-control">
        <label for="email">דוא״ל</label>
        <input id="email" type="email" required />
      </div>

      <button type="submit">שליחה</button>
    </form>
  </div>
