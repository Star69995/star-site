  <meta name="twitter:image" content="https://star69995.github.io/star-site/css-projects/gallery/img/og-image.png">
</head>

<body>
  <div class="container">
    <div class="text-content">
      <h1>לגלות את העולם</h1>
      <p>העולם מלא בהרפתקאות מופלאות שמחכות לכם. התחילו לחקור, לגלות, ולהרגיש את הריגוש של הבלתי נודע.</p>
    </div>

    <div>
      <img src="img/Rectangle 514.png">
    </div>
    <div>
      <img src="img/Rectangle 515.png">
    </div>
    <div>
      <img src="img/Rectangle 506-5.png">
    </div>
    <div>
      <img src="img/Rectangle 516.png">
    </div>
    <div>
      <img src="img/Rectangle 506-1.png">
    </div>
    <div>
      <img src="img/Rectangle 506-4.png">
    </div>
    <div>
      <img src="img/Rectangle 506-3.png">
    </div>
    <div>
      <img src="img/Rectangle 506-2.png">
    </div>

    <div class="container-form">
      <form>
        <h2 class="form-title">ספרו לנו על החוויה שלכם</h2>
        <p class="form-text">היו חלק מהסיפור שלנו, וספרו לנו איך העולם סחף אתכם למחוזות חדשים.</p>
        <div class="form-control">
          <label for="name">שם מלא</label>
          <input id="name" type="name" required />
        </div>
        <div class="form-control">
          <label for="email">דוא״ל</label>
          <input id="email" type="email" required />
        </div>
        <div class="form-control">
          <label for="experience">החוויה שלכם</label>
          <textarea id="experience" rows="4" required></textarea>
        </div>
        <button type="submit">שליחה</button>
      </form>
    </div>

    <div>
      <img src="img/Rectangle 506-7.png">
    </div>
    <div>
      <img src="img/Rectangle 506-8.png">
    </div>
    <div>
      <img src="img/Rectangle 506-6.png">
    </div>
    <div>
      <img src="img/Rectangle 506-9.png">
    </div>
    <div>
      <img src="img/Rectangle 506.png">
    </div>
    <div>
      <img src="img/Rectangle 513.png">
    </div>
  </div>


</body>

</html>
